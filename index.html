<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ValoStat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="ValoStat" />
  <meta property="og:description" content="Track and compare Valorant player stats with ValoStat. Get insights on your performance and see how you stack up against others!" />
  <meta property="og:image" content="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/cbf4460132cdfeb2a97fad5f9dd25ba0bc058f76-128x128.png?accountingTag=VAL" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/cbf4460132cdfeb2a97fad5f9dd25ba0bc058f76-128x128.png?accountingTag=VAL" />
</head>
<body>

  <!-- HEADER SECTION -->
  <header class="header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="title">ValoStat</h1>
        <p class="subtitle" id="updateTime">Checking when stats were last updated…</p>
      </div>
    </div>
  </header>

  <!-- HIGHLIGHTS: last 24 hours of the current act, independent of the act tabs below.
       Collapsed until clicked. -->
  <section class="highlights" hidden>
    <div class="highlights-content">
      <button type="button" class="highlights-toggle" id="highlightsToggle" aria-expanded="false" aria-controls="highlightsPanel">
        <span class="highlights-title">Highlights</span>
        <span class="highlights-teaser" id="highlightsTeaser">The last 24 hours</span>
        <span class="highlights-chevron" aria-hidden="true"></span>
      </button>
      <div class="highlights-panel" id="highlightsPanel" hidden>
        <p class="highlights-note" id="highlightsNote"></p>
        <div class="highlight-grid" id="highlightGrid"></div>
      </div>
    </div>
  </section>

  <!-- ACT NAVBAR -->
  <nav class="act-navbar">
    <div class="navbar-content">
      <span class="navbar-label">Act</span>
      <div class="navbar-buttons" id="actNav" aria-label="Choose act"></div>
    </div>
  </nav>

  <!-- CONTROLS SECTION -->
  <div class="controls-bar">
    <div class="controls-section">
      <div class="sort-control">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <!-- Filled from the STATS list in script.js -->
          <option value="default">Default order</option>
        </select>
        <button id="sortDirection" class="sort-direction" type="button" disabled>Highest first</button>
        <label id="minMatchesControl" class="min-matches" hidden>
          Min. matches
          <input type="number" id="minMatches" min="0" step="1" inputmode="numeric" placeholder="0" />
        </label>
      </div>

      <div class="toggle-control">
        <label for="toggleDiff">Show changes since last update</label>
        <label class="toggle">
          <input type="checkbox" id="toggleDiff" name="toggleDiff" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <main>
    <!-- PLAYER CARDS -->
    <div id="profiles" class="grid">
      <p class="no-changes">Loading stats…</p>
    </div>

    <!-- COMPARISON -->
    <div class="compare-section">
      <h2>Compare players</h2>
      <div class="compare-controls">
        <select id="playerA"></select>
        <span>vs</span>
        <select id="playerB"></select>
        <button id="compareBtn">Compare</button>
      </div>
      <div id="comparison"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
