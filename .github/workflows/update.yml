name: Update Valorant Stats

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backup previous stats
        run: |
          if [ -f stats.json ]; then
            cp stats.json stats_prev.json
          fi

      - name: Fetch Valorant stats
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
        run: python fetch_valo.py

      - name: Commit & push
        run: |
          git config user.name "valostat-bot"
          git config user.email "bot@github.com"

          # Stats files are committed only when they changed, so stats_prev.json
          # keeps pointing at the last real change for "Show changes".
          # acts.json and data/ change when a new act starts.
          if [ -n "$(git status --porcelain -- stats.json acts.json data)" ]; then
            git add stats.json stats_prev.json acts.json data
            message="Auto-update Valorant stats"
          else
            message="Stats checked, no changes"
          fi

          # meta.json records when the stats were checked, so it changes every run.
          git add meta.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "$message"
          git push
